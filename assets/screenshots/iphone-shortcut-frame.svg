<svg width="380" height="822" viewBox="0 0 380 822" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">iPhone Shortcut screenshot in a phone frame</title>
  <desc id="desc">A phone-framed screenshot of the iPhone Shortcut that sends location data.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.34"/>
    </filter>
    <clipPath id="screen">
      <rect x="20" y="20" width="340" height="782" rx="52"/>
    </clipPath>
  </defs>
  <rect x="8" y="8" width="364" height="806" rx="64" fill="#020617" filter="url(#shadow)"/>
  <rect x="13" y="13" width="354" height="796" rx="60" fill="#111827" stroke="#334155" stroke-width="2"/>
  <image href="iphone-shortcut.png" x="20" y="20" width="340" height="782" preserveAspectRatio="xMidYMid slice" clip-path="url(#screen)"/>
  <rect x="20" y="20" width="340" height="782" rx="52" stroke="#020617" stroke-width="8"/>
  <rect x="152" y="28" width="76" height="6" rx="3" fill="#475569" opacity="0.55"/>
  <rect x="4" y="178" width="6" height="70" rx="3" fill="#1E293B"/>
  <rect x="4" y="266" width="6" height="104" rx="3" fill="#1E293B"/>
  <rect x="370" y="230" width="6" height="122" rx="3" fill="#1E293B"/>
</svg>
